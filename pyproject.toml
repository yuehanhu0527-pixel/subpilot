[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "subpilot"
version = "0.1.0"
description = "SubPilot — an AI agent that helps substitute teachers get through their day at an unfamiliar school."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # Phase 1 — RAG pipeline
    "pypdf>=5.0",
    "python-docx>=1.1",
    "sentence-transformers>=3.0",
    "chromadb>=0.5",
    "langgraph>=1.2.11",
    "httpx>=0.28.1",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: slow tests that use the real embedding model (run with: pytest -m integration)",
]
