[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "subpilot"
version = "0.1.0"
description = "SubPilot — an AI agent that helps substitute teachers get through their day at an unfamiliar school."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
# 阶段 1 起会陆续加入：pypdf、python-docx、sentence-transformers、chromadb、
# langgraph、langgraph-checkpoint-sqlite、anthropic 等（届时更新此文件）。
