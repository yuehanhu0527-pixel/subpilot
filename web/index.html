<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SubPilot — your day, guided</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">SubPilot</div>
    <div class="topline" id="topline"></div>
  </header>

  <main class="layout">
    <section class="column main">
      <div class="hero">
        <h1>What should I do now?</h1>
        <p class="hero-answer" id="hero-answer"></p>
      </div>

      <section class="chat card" id="chat-section">
        <div class="messages" id="messages"></div>
        <form class="composer" id="composer">
          <input type="text" id="chat-input" placeholder="Ask SubPilot — policies, students, the day…" autocomplete="off">
          <button type="submit" id="send-btn">Send</button>
        </form>
      </section>

      <section class="report-section" id="report-section">
        <div class="section-head">
          <h2 class="eyebrow">End-of-Day Report</h2>
          <button class="quiet-btn" id="generate-report" type="button">Generate note</button>
        </div>
        <article class="letter card" id="report-letter" hidden>
          <div class="letter-body" id="report-body"></div>
        </article>
      </section>
    </section>

    <aside class="column side">
      <section class="panel card" id="now-panel">
        <h2 class="eyebrow">Now</h2>
        <div class="now-body" id="now-body"></div>
        <ol class="timeline" id="timeline"></ol>
      </section>

      <section class="panel card" id="bathroom-panel">
        <h2 class="eyebrow">Bathroom</h2>
        <ul class="quiet-list" id="bathroom-list"></ul>
      </section>

      <section class="panel card" id="events-panel">
        <h2 class="eyebrow">Events</h2>
        <ol class="event-list" id="events-list"></ol>
      </section>

      <section class="panel card" id="documents-panel">
        <h2 class="eyebrow">Documents</h2>
        <div class="dropzone" id="dropzone">
          <input type="file" id="file-input" multiple hidden accept=".pdf,.docx,.txt,.md">
          <p>Drop files here, or <span class="link">browse</span></p>
          <p class="hint">PDF · DOCX · TXT · MD</p>
        </div>
        <ul class="quiet-list" id="doc-list"></ul>
      </section>

      <section class="notes" id="notes"></section>
    </aside>
  </main>

  <script src="/app.js"></script>
</body>
</html>
