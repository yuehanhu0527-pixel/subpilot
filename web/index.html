<!DOCTYPE html>

  <title>SubPilot — AI Agent for Substitute Teachers</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">

  <main class="layout">

    <!-- 状态栏：阶段 5 实现 Now / trackers / events / documents -->

      <div class="card placeholder">Now · current period (later)</div>
      <div class="card placeholder">Bathroom trackers (later)</div>
